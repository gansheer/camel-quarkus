# a retriever declared in configuration, scoped by an invocation parameter
quarkus.camel.langchain4j.retriever.orders.uri=direct:orders
quarkus.camel.langchain4j.retriever.orders.document-id-key=orderId
quarkus.camel.langchain4j.retriever.orders.timeout=5s
# a failing source that degrades to no content
quarkus.camel.langchain4j.retriever.broken.uri=direct:broken
quarkus.camel.langchain4j.retriever.broken.on-error=empty
